// ---------- canvas textures (low-res, photographic-ish) ----------
function canvasTex(w, h, draw, rx=1, ry=1){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const rnd = (a,b) => a + Math.random()*(b-a);
const woodTex = canvasTex(256, 256, (g,s) => {
  g.fillStyle = '#86643f'; g.fillRect(0,0,s,s);
  for (let p=0;p<4;p++){
    const y = p*64;
    g.fillStyle = ['#8d6b45','#7e5f3c','#896842','#775a38'][p]; g.fillRect(0,y,s,64);
    for (let i=0;i<52;i++){
      g.strokeStyle = `rgba(${52+Math.random()*36|0},${32+Math.random()*22|0},14,${rnd(0.08,0.3)})`;
      g.lineWidth = rnd(0.6,1.8); g.beginPath();
      const yy = y + rnd(4,60); g.moveTo(0,yy);
      g.bezierCurveTo(s*0.3, yy+rnd(-3,3), s*0.7, yy+rnd(-3,3), s, yy+rnd(-2,2)); g.stroke();
    }
    g.fillStyle = 'rgba(38,22,8,0.6)'; g.fillRect(0,y,s,2);
  }
}, 2.5, 2);
const plasterTex = canvasTex(256, 256, (g,s) => {
  g.fillStyle = '#c4b69c'; g.fillRect(0,0,s,s);
  for (let i=0;i<26;i++){ // soft large mottling only, no speckle
    const x = rnd(0,s), y = rnd(0,s), r = rnd(30,90);
    const gr = g.createRadialGradient(x, y, 2, x, y, r);
    const warm = Math.random() < 0.5;
    gr.addColorStop(0, warm ? 'rgba(120,100,70,0.055)' : 'rgba(235,230,215,0.05)');
    gr.addColorStop(1, 'rgba(120,100,70,0)');
    g.fillStyle = gr; g.fillRect(0,0,s,s);
  }
}, 3, 1.6);
const rugTex = canvasTex(256, 256, (g,s) => {

  g.strokeStyle = '#c2a87f'; g.lineWidth = 5; g.strokeRect(14,14,s-28,s-28);
  g.strokeStyle = '#9c4f2d'; g.lineWidth = 10; g.strokeRect(30,30,s-60,s-60);
  for (let i=0;i<3000;i++){
    g.fillStyle = `rgba(${Math.random()<0.5?28:225},18,12,${rnd(0.03,0.08)})`;
    g.fillRect(rnd(0,s), rnd(0,s), rnd(1,2.4), rnd(1,2.4));
  }
});

  g.fillStyle = sky; g.fillRect(0,0,w,h);

  for (let i=0;i<26;i++){ // distant blocks
    const bw = rnd(18,52), bh = rnd(26,86), x = rnd(0,w-bw);

    g.fillRect(x, h*0.78-bh, bw, bh);
    g.fillStyle = 'rgba(240,238,200,0.5)';
    for (let wy=0; wy<bh-8; wy+=9) for (let wx=4; wx<bw-5; wx+=8) if (Math.random()<0.4) g.fillRect(x+wx, h*0.78-bh+4+wy, 3.4, 4.6);
  }
  g.fillStyle = '#5d6066'; g.fillRect(0, h*0.78, w, h*0.22);
  g.fillStyle = '#494c50';
  for (let i=0;i<8;i++){ const bw=rnd(40,90); g.fillRect(rnd(0,w-bw), h*0.78, bw, rnd(8,20)); }
});

// ---------- decimated textured models ----------
const loader = new GLTFLoader();
async function place(file, target, x, z, ry=0, yBase=0){
  const g = await loader.loadAsync('models/ps2/' + file);
  const obj = g.scene;
  obj.traverse(o => {
    if (o.isMesh){
      o.castShadow = true; o.receiveShadow = true;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(mt => {           // era shading: diffuse only, no normal/AO maps
        mt.normalMap = null; mt.roughnessMap = null; mt.metalnessMap = null;
        mt.aoMap = null; mt.metalness = 0; mt.roughness = Math.max(mt.roughness ?? 0.9, 0.75);
        mt.needsUpdate = true;
      });
    }
  });
  const bb = new THREE.Box3().setFromObject(obj);
  const size = bb.getSize(new THREE.Vector3());
  const s = target / Math.max(size.x, size.y, size.z);
  obj.scale.setScalar(s);
  obj.rotation.y = ry;
  obj.updateMatrixWorld(true);
  const bb2 = new THREE.Box3().setFromObject(obj);
  obj.position.set(x - (bb2.min.x + bb2.max.x)/2, yBase - bb2.min.y, z - (bb2.min.z + bb2.max.z)/2);
  scene.add(obj);
  return obj;
}

  g.traverse(o => { if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
  scene.add(g);
}

let __loaded = 0;
const __loadEl = document.getElementById('loading');
await Promise.allSettled(jobs.map(p => Promise.resolve(p).then(() => {
  __loaded++;
  __loadEl.textContent = '正在进入宫殿…（' + __loaded + ' / ' + jobs.length + '）';

// ---------- immersive route glide ----------
const spots = [
  { name:'房门',   pos:[2.3, 1.6, -0.3],   look:[2.35, 1.2, -2.05] },
  { name:'衣帽架', pos:[1.45, 1.6, -0.7],   look:[1.45, 1.25, -1.8] },
  { name:'沙发',   pos:[-1.1, 1.6, -0.85],  look:[-2.5, 0.85, -0.85] },
  { name:'茶几',   pos:[-0.45, 1.6, -0.1],  look:[-1.45, 0.42, -0.85] },
  { name:'落地灯', pos:[-1.9, 1.6, -1.1],   look:[-2.82, 1.3, -1.8] },
  { name:'书桌',   pos:[-1.5, 1.6, 1.12],   look:[-2.55, 0.8, 1.12] },
  { name:'电脑',   pos:[-1.9, 1.6, 1.02],   look:[-2.62, 1.02, 1.0] },
  { name:'书架',   pos:[-1.5, 1.6, -0.75],  look:[-1.5, 1.15, -1.88] },
  { name:'窗台',   pos:[-0.15, 1.6, -0.8],  look:[-0.15, 1.72, -2.05] },
  { name:'挂钟',   pos:[0.72, 1.6, -0.9],   look:[0.72, 2.02, -2.0] },
];
const V3 = a => new THREE.Vector3(a[0], a[1], a[2]);
function angles(from, to){
  const d = to.clone().sub(from);
  return { yaw: Math.atan2(-d.x, -d.z), pitch: Math.atan2(d.y, Math.hypot(d.x, d.z)) };
}
let cur = 0;
let camPos = V3(spots[0].pos);
let base = angles(camPos, V3(spots[0].look));
let yawOff = 0, pitchOff = 0, anim = null;
camera.rotation.order = 'YXZ';
function applyCam(){
  camera.position.copy(camPos);
  camera.rotation.set(base.pitch + pitchOff, base.yaw + yawOff, 0);
}
function goTo(i){
  i = Math.max(0, Math.min(spots.length - 1, i));
  const fromBase = { yaw: base.yaw, pitch: base.pitch };
  const toPos = V3(spots[i].pos), toBase = angles(toPos, V3(spots[i].look));
  let dyaw = toBase.yaw - fromBase.yaw;
  while (dyaw > Math.PI) dyaw -= Math.PI * 2;
  while (dyaw < -Math.PI) dyaw += Math.PI * 2;
  anim = { t: 0, fromPos: camPos.clone(), toPos, fromBase, toBase, dyaw,
           fromYawOff: yawOff, fromPitchOff: pitchOff };
  cur = i; updateUI();
}
const ease = t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2;
let last = performance.now();
function tick(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  if (anim){
    anim.t += dt / 1.5;
    const e = ease(Math.min(1, anim.t));
    camPos.lerpVectors(anim.fromPos, anim.toPos, e);
    base = { yaw: anim.fromBase.yaw + anim.dyaw * e,
             pitch: anim.fromBase.pitch + (anim.toBase.pitch - anim.fromBase.pitch) * e };
    yawOff = anim.fromYawOff * (1 - e); pitchOff = anim.fromPitchOff * (1 - e);
    if (anim.t >= 1) anim = null;
  }
  applyCam();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
let drag = null;
renderer.domElement.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; });
addEventListener('pointermove', e => {
  if (!drag) return;
  yawOff = THREE.MathUtils.clamp(yawOff - (e.clientX - drag.x) * 0.0042, -1.15, 1.15);
  pitchOff = THREE.MathUtils.clamp(pitchOff - (e.clientY - drag.y) * 0.0032, -0.42, 0.5);
  drag = { x: e.clientX, y: e.clientY };
});
addEventListener('pointerup', () => drag = null);
const label = document.getElementById('spotName');
const count = document.getElementById('spotCount');
const dots = document.getElementById('dots');
spots.forEach((s2, i) => {
  const d = document.createElement('button');
  d.className = 'dot'; d.setAttribute('aria-label', s2.name);
  d.addEventListener('click', () => goTo(i));
  dots.appendChild(d);
});
function updateUI(){
  label.textContent = '第 ' + (cur + 1) + ' 个点 · ' + spots[cur].name;
  count.textContent = (cur + 1) + ' / ' + spots.length;
  [...dots.children].forEach((d, i) => d.classList.toggle('on', i === cur));
  document.getElementById('prevBtn').disabled = cur === 0;
  document.getElementById('nextBtn').disabled = cur === spots.length - 1;
}
document.getElementById('prevBtn').addEventListener('click', () => goTo(cur - 1));
document.getElementById('nextBtn').addEventListener('click', () => goTo(cur + 1));
function onResize(){
  camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 1 ? 74 : 62;
  camera.updateProjectionMatrix();
  renderer.setSize(Math.round(innerWidth * 0.55), Math.round(innerHeight * 0.55), false);
}
addEventListener('resize', onResize);
onResize();
window.__walk = { goTo, get cur(){ return cur; }, isAnimating: () => !!anim };
updateUI();
applyCam();
document.getElementById('loading').classList.add('hide');
window.__ready = true;
console.log('walk ready');
requestAnimationFrame(tick);
</script>
