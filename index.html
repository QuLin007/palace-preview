<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>粒子书房 · 写实版预览</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#070503; }
  #app { position:fixed; inset:0; }
  canvas { display:block; touch-action:none; }
  html, body { overscroll-behavior:none; }
  #tip { position:fixed; left:0; right:0; bottom:18px; text-align:center; color:rgba(255,240,220,.55);
         font:13px -apple-system, sans-serif; pointer-events:none; }
</style>
</head>
<body>
<div id="app"></div>
<div id="tip">正在加载粒子…</div>
<script src="./palace-bundle.js"></script>
<script>
Promise.all([
  fetch('./points-meta.json').then(r => r.json()),
  fetch('./points-pos.bin').then(r => r.arrayBuffer()),
  fetch('./points-col.bin').then(r => r.arrayBuffer()),
  fetch('./points-scl.bin').then(r => r.arrayBuffer())
]).then(([meta, posBuf, colBuf, sclBuf]) => {
  const n = meta.n;
  const q = new Int16Array(posBuf);
  const pos = new Float32Array(n * 3);
  for (let i = 0; i < n * 3; i++) {
    const a = i % 3;
    pos[i] = (q[i] + 32768) / 65535 * (meta.max[a] - meta.min[a]) + meta.min[a];
  }
  const colU = new Uint8Array(colBuf);
  const col = new Float32Array(n * 3);
  for (let i = 0; i < n * 3; i++) col[i] = colU[i] / 255;
  const sclU = new Uint8Array(sclBuf);
  const scl = new Float32Array(n);
  const pha = new Float32Array(n);
  let seed = 42;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const dly = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    scl[i] = sclU[i] / 255 * 1.5;
    pha[i] = rnd() * Math.PI * 2;
    dly[i] = Math.min(0.5, (pos[i * 3 + 1] / 2.75) * 0.38 + rnd() * 0.12);
  }

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0.027, 0.02, 0.012);
  const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(7.9, 6.6, 9.8);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.getElementById('app').appendChild(renderer.domElement);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.75, 0);
  controls.enableDamping = true; controls.dampingFactor = 0.06;
  controls.minDistance = 3; controls.maxDistance = 22;
  controls.maxPolarAngle = Math.PI * 0.495;
  controls.autoRotate = true; controls.autoRotateSpeed = 0.45;
  controls.enablePan = false;
  controls.rotateSpeed = 0.55;
  controls.zoomSpeed = 0.7;
  controls.addEventListener('start', () => { controls.autoRotate = false; });
  const HOME_POS = new THREE.Vector3(7.9, 6.6, 9.8);
  const HOME_TGT = new THREE.Vector3(0, 0.75, 0);
  let lastTap = 0;
  renderer.domElement.addEventListener('touchend', () => {
    const now = Date.now();
    if (now - lastTap < 320) { camera.position.copy(HOME_POS); controls.target.copy(HOME_TGT); if (window.__replayGrow) window.__replayGrow(); }
    lastTap = now;
  });
  renderer.domElement.addEventListener('dblclick', () => {
    camera.position.copy(HOME_POS); controls.target.copy(HOME_TGT); if (window.__replayGrow) window.__replayGrow();
  });

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.setAttribute('aScale', new THREE.BufferAttribute(scl, 1));
  geo.setAttribute('aPhase', new THREE.BufferAttribute(pha, 1));
  geo.setAttribute('aDelay', new THREE.BufferAttribute(dly, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uSize: { value: 0.115 }, uGrow: { value: 0 } },
    vertexShader: `
      attribute float aScale; attribute float aPhase; attribute float aDelay;
      uniform float uTime; uniform float uSize; uniform float uGrow;
      varying vec3 vColor; varying float vTw; varying float vGrow;
      void main() {
        vColor = color;
        float local = clamp((uGrow - aDelay) / 0.55, 0.0, 1.0);
        float ease = 1.0 - pow(1.0 - local, 3.0);
        vGrow = ease;
        vec3 p = position;
        p.y *= ease;
        p.x = mix(p.x * 0.93, p.x, ease);
        p.z = mix(p.z * 0.93, p.z, ease);
        p.x += sin(uTime * 0.4 + aPhase) * 0.0012 * ease;
        p.y += sin(uTime * 0.55 + aPhase * 1.7) * 0.0015 * ease;
        vTw = 0.96 + 0.05 * sin(uTime * (0.9 + fract(aPhase) * 0.9) + aPhase * 3.1);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_PointSize = uSize * aScale * ease * (300.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying vec3 vColor; varying float vTw; varying float vGrow;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        float a = smoothstep(0.5, 0.36, d) * vGrow;
        if (a < 0.03) discard;
        gl_FragColor = vec4(vColor * vTw, a);
      }`,
    vertexColors: true, transparent: true, depthWrite: true, blending: THREE.NormalBlending
  });
  scene.add(new THREE.Points(geo, mat));
  document.getElementById('tip').textContent = '粒子书房 · 写实锐利版 — 拖动旋转，捏合缩放';
  const clock = new THREE.Clock();
  let growStart = clock.getElapsedTime();
  window.__replayGrow = () => { growStart = clock.getElapsedTime(); };
  (function tick() {
    requestAnimationFrame(tick);
    const t = clock.getElapsedTime();
    mat.uniforms.uTime.value = t;
    mat.uniforms.uGrow.value = Math.min(1.05, (t - growStart) / 2.8 * 1.05);
    controls.update();
    renderer.render(scene, camera);
  })();
  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}).catch(e => {
  document.getElementById('tip').textContent = '加载失败，请刷新重试';
});
</script>
</body>
</html>
